name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      OPENAI_API_KEY: ""
      OPEN_API_KEY: ""
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install test dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Run offline tests
        run: .\.venv\Scripts\python.exe -m pytest -m "not integration" --junitxml=test-results/pytest.xml
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 7
